<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img"><title>Syntax masks, not schema enforcement</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#94a3b8"/></marker></defs><rect width="1100" height="430" fill="#020617"/><g font-family="monospace" fill="#e2e8f0"><text x="35" y="52" font-size="26">pushdown / Syntax masks, not schema enforcement</text><path d="M270,155 H295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M535,155 H560" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M800,155 H825" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="112" width="240" height="85" rx="8" fill="#0f172a" stroke="#34d399"/><text x="150" y="159" text-anchor="middle" font-size="15">Unicode prefix</text><rect x="295" y="112" width="240" height="85" rx="8" fill="#0f172a" stroke="#34d399"/><text x="415" y="159" text-anchor="middle" font-size="15">Immutable parser state</text><rect x="560" y="112" width="240" height="85" rx="8" fill="#0f172a" stroke="#34d399"/><text x="680" y="159" text-anchor="middle" font-size="15">Candidate token replay</text><rect x="825" y="112" width="240" height="85" rx="8" fill="#0f172a" stroke="#34d399"/><text x="945" y="159" text-anchor="middle" font-size="15">Allow mask + EOS</text><text x="45" y="255" font-size="19">Scalar completion events</text><text x="45" y="298" font-size="19">Separate SideMemory helper</text><text x="45" y="341" font-size="19">No mask integration</text><text x="45" y="400" font-size="14" fill="#94a3b8">Green: execution path | Notes: state / lifetime constraints | Offline, no external dependencies</text></g></svg>