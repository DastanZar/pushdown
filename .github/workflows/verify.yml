name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev,viz]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m pytest -q
      - run: python benchmarks/run.py
      - run: python demos/make_figures.py
      - run: python -m build
