[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[project]
name = "pushdown"
version = "0.1.0"
description = "Auditable syntax-only JSON prefix masks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.14,<0.15", "mypy>=1.20,<2", "build>=1.4,<2"]
viz = ["matplotlib>=3.10,<4", "pillow>=12,<13"]

[tool.hatch.build.targets.wheel]
packages = ["pushdown"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
files = ["pushdown"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
